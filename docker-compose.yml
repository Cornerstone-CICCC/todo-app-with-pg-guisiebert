services:
  db:
    image: postgres:16
    container_name: todo_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: todo_app
    ports:
      - "5434:5432"
    volumes:
      - todo_pg_data:/var/lib/postgresql/data

volumes:
  todo_pg_data:
